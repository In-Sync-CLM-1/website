    <meta charset="UTF-8" />

    <!--
      2026-09-13: every title/description/keywords/canonical/og:*/twitter:*/
      geo tag used to be hardcoded here for the HOMEPAGE, and every route
      that renders <SEOHelmet> (react-helmet-async) ADDS its own copy of
      these tags on top rather than replacing them — Helmet only dedupes
      tags it manages across route changes, it has no way to remove tags
      that were already in the static HTML before React mounted. Result:
      every Helmet-covered page (all 10 product pages plus home/features/
      pricing/industries/resources/solutions) carried TWO of every one of
      these tags simultaneously, canonical included — confirmed live via a
      real duplicate-tag count in the rendered DOM. Removed here so
      SEOHelmet's per-route config is the ONLY source for these; a route
      with no <SEOHelmet> of its own currently falls back to nothing rather
      than the (wrong) homepage values — a real gap, but a strictly better
      one than a broken duplicate canonical, and the fix for it is giving
      that route its own SEOHelmet, not restoring this block.
    -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Bare fallback title only — react-helmet-async DOES correctly replace
         <title> (the DOM/document.title API is a real singleton, unlike
         <meta>/<link> tags), so this never duplicates the way the removed
         tags above did. Still generic/homepage-flavoured because this file
         is served identically for every route (no SSR) — the per-route
         title only takes effect after JS hydrates. -->
    <title>In-Sync - Run Your Entire Business on One Platform | India</title>
